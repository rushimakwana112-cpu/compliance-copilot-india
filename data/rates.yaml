# Statutory figures used by the calculators (app/tools.py) and as SQL parameters.
#
# This is the ONLY place numbers from the law live in this project.
# Fill each `value` from the official circular/notification and record where it came from.
# A value left as null makes the calculator answer "rate not configured" instead of guessing.
#
#   value:          number (rates as fractions, e.g. a 10% rate is 0.10; money in INR per month)
#   source_doc:     the document the figure comes from (shown to the user as the citation)
#   section:        section / para / page in that document
#   effective_date: YYYY-MM-DD from which the figure applies
#   url:            official link

