# Professional Tax is a state levy. One list of dated versions per state id from data/states.yaml.
# Slabs are monthly salary ranges: `from` inclusive, `to` inclusive (null `to` = and above).
professional_tax:
  gujarat:
    - effective_from: 2022-04-01
      effective_to: null
      status: current
      source_doc: "Rate of Profession Tax, Gujarat State Tax on Professions, Trades, Callings and Employments Act, 1976"
      section: "Schedule, entry 1"
      url: "https://commercialtax.gujarat.gov.in/vatwebsite/download/schedule/Rate_of_Profession_Tax.pdf"
      slabs:
        - {from: 0, to: 12000, monthly_tax: 0}
        - {from: 12000.01, to: null, monthly_tax: 200}
  # Maharashtra has separate slabs for women and a higher February deduction, which these simple
  # monthly slabs can't express yet; left empty until confirmed on mahagst.gov.in.
  maharashtra:
    - effective_from: null
      effective_to: null
      status: current
      source_doc: "Maharashtra State Tax on Professions, Trades, Callings and Employments Act, 1975, Schedule I"
      section: ""
      url: ""
      slabs:
        - {from: null, to: null, monthly_tax: null}
        - {from: null, to: null, monthly_tax: null}

# Due dates, answered by app/deadlines.py ("When is PF due?").
#   value: a day of the month after the wage month (with month_offset: 1), or
#          a map of label -> "MM-DD" (quarterly statements), or one "MM-DD" (yearly).
#   note:  shown with the answer (exceptions, who it applies to).
due_dates:
  pf:
    - {value: 15, month_offset: 1, effective_from: 2026-06-29, effective_to: null, status: current,
       source_doc: "EPF Scheme, 2026 (G.S.R. 525(E)) - check", section: "paras 20(1), 29(2)", url: "",
       note: "Contributions and the ECR (electronic challan-cum-return) for a wage month are due within 15 days after it ends."}
  esic:
    - {value: 15, month_offset: 1, effective_from: null, effective_to: null, status: current,
       source_doc: "ESIC: Contribution", section: "", url: "https://esic.gov.in/contribution",
       note: "Due within 15 days of the last day of the calendar month."}
  tds_salary_deposit:
    - {value: 7, month_offset: 1, effective_from: 2026-04-01, effective_to: null, status: current,
       source_doc: "Income-tax Rules, 2026", section: "rule 218(2)", url: "https://www.incometaxindia.gov.in/w/rule-218-1",
       note: "Tax deducted in March is due by 30 April. Government offices paying without a challan deposit it the same day."}
  tds_quarterly_statement:
    - {value: {"Q1 (Apr-Jun)": "07-31", "Q2 (Jul-Sep)": "10-31", "Q3 (Oct-Dec)": "01-31", "Q4 (Jan-Mar)": "05-31"},
       effective_from: 2026-04-01, effective_to: null, status: current,
       source_doc: "Income-tax Rules, 2026 (Form 138, formerly Form 24Q)", section: "rule 219(4)",
       url: "https://www.incometaxindia.gov.in/w/rule-219-1"}
  form16:
    - {value: "06-15", effective_from: 2026-04-01, effective_to: null, status: current,
       source_doc: "Income-tax Rules, 2026 (Form 130, formerly Form 16)", section: "rule 215(1)",
       url: "https://www.incometaxindia.gov.in/w/rule-215-1",
       note: "Form 130 (formerly Form 16) is issued to employees by 15 June after the end of the tax year."}
  professional_tax:
    gujarat:
      - {value: 15, month_offset: 1, effective_from: null, effective_to: null, status: current,
         source_doc: "Surat Municipal Corporation: Profession Tax FAQ", section: "FAQ 20-21",
