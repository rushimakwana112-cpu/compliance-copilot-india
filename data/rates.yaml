# Statutory figures used by the calculators (app/tools.py), as SQL parameters, and by GET /api/rates.
#
# This is the ONLY place numbers from the law live in this project.
# Each figure is a LIST of dated versions, so a change in the law is a new entry, not an edit:
#
#   value:          number (rates as fractions, e.g. a 10% rate is 0.10; money in INR per month), or null
#   effective_from: YYYY-MM-DD the version applies from (null = not known yet)
#   effective_to:   YYYY-MM-DD it stopped applying (null = still applies / not known)
#   source_doc:     the official document the figure comes from (shown to the user as the citation)
#   section:        section / para / page in that document
#   status:         current | historical
#   url:            official link
#
# The calculators use the version valid on today's date (or on a date written in the question).
# When several versions are valid (dates not filled in yet), the `current` one wins.
# A null value makes the calculator answer "Rate not configured: <field>" instead of guessing.
# Everything still null, or marked "check", is listed in NEXT_STEPS_FOR_RUSHI.md.
# "check" = the figure was read from a copy of the official Gazette text, not on the official host;
# open the official PDF and confirm it, then remove " - check".

pf:
  # Wage ceiling for EPF contributions (Code on Social Security s.2(89), for Chapter III).
  wage_ceiling:
    - {value: 15000, effective_from: null, effective_to: 2026-09-16, status: historical,
       source_doc: "EPF Scheme, 1952 (wage ceiling before the 2026 notification) - check", section: "", url: ""}
    - {value: 25000, effective_from: 2026-09-17, effective_to: null, status: current,
       source_doc: "MoLE notification S.O. 5109(E), 17 Sept 2026", section: "Code on Social Security s.2(89)",
       url: "https://www.labour.gov.in/static/uploads/2026/09/2b0f1dbbd3769fc388416186ec145328.pdf"}
  employee_rate:
    - {value: 0.12, effective_from: 2026-06-29, effective_to: null, status: current,
       source_doc: "EPF Scheme, 2026 (G.S.R. 525(E)); S.O. 3582(E), 1 July 2026 - check", section: "para 18(2)", url: ""}
  employer_rate:
    - {value: 0.12, effective_from: 2026-06-29, effective_to: null, status: current,
       source_doc: "EPF Scheme, 2026 (G.S.R. 525(E)); S.O. 3582(E), 1 July 2026 - check", section: "para 18(2)", url: ""}
  eps_rate:
    - {value: 0.0833, effective_from: 2026-06-29, effective_to: null, status: current,
       source_doc: "S.O. 3580(E), 1 July 2026 (EPS contribution) - check", section: "Code on Social Security s.16(1)(b)",
       url: ""}
  # Pensionable wage cap for the EPS share: the notified wage ceiling (EPS, 2026 paras 4(1), 11(3)).
  eps_wage_cap:
    - {value: 25000, effective_from: 2026-09-17, effective_to: null, status: current,
       source_doc: "EPS, 2026 (G.S.R. 527(E)) with S.O. 5109(E) - check", section: "paras 4(1), 11(3)", url: ""}
  edli_rate:
    - {value: 0.005, effective_from: 2026-06-29, effective_to: null, status: current,
       source_doc: "S.O. 3581(E), 1 July 2026 (EDLI contribution) - check", section: "Code on Social Security s.16(1)(c)",
       url: ""}

