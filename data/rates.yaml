# Statutory figures used by the calculators (app/tools.py), as SQL parameters, and by GET /api/rates.
#
# This is the ONLY place numbers from the law live in this project.
# Each figure is a LIST of dated versions, so a change in the law is a new entry, not an edit:
#
#   value:          number (rates as fractions, e.g. a 10% rate is 0.10; money in INR per month), or null
#   effective_from: YYYY-MM-DD the version applies from (null = not known yet)
#   effective_to:   YYYY-MM-DD it stopped applying (null = still applies / not known)
#   source_doc:     the official document the figure comes from (shown to the user as the citation)
#   section:        section / para / page in that document
#   status:         current | historical
#   url:            official link
#
# The calculators use the version valid on today's date (or on a date written in the question).
# When several versions are valid (dates not filled in yet), the `current` one wins.
# A null value makes the calculator answer "Rate not configured: <field>" instead of guessing.
# Everything still null, or marked "check", is listed in NEXT_STEPS_FOR_RUSHI.md.

pf:
  # Wage ceiling for EPF contributions.
  wage_ceiling:
    - {value: 15000, effective_from: null, effective_to: null, status: historical,
       source_doc: "EPF Scheme, 1952 (wage ceiling before the 2026 notification) - check", section: "", url: ""}
    - {value: 25000, effective_from: null, effective_to: null, status: current,
       source_doc: "Gazette notification 17 Sept 2026", section: "",
       url: "https://www.labour.gov.in/static/uploads/2026/09/2b0f1dbbd3769fc388416186ec145328.pdf"}
  employee_rate:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "EPF Scheme, 2026", section: "", url: ""}
  employer_rate:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "EPF Scheme, 2026", section: "", url: ""}
  eps_rate:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "EPS, 2026", section: "", url: ""}
  # Pensionable wage cap for the EPS share.
  eps_wage_cap:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "EPS, 2026", section: "", url: ""}
  edli_rate:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "EDLI Scheme, 2026", section: "", url: ""}

esic:
