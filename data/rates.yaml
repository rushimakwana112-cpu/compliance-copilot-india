       source_doc: "S.O. 3580(E), 1 July 2026 (EPS contribution) - check", section: "Code on Social Security s.16(1)(b)",
       url: ""}
  # Pensionable wage cap for the EPS share: the notified wage ceiling (EPS, 2026 paras 4(1), 11(3)).
  eps_wage_cap:
    - {value: 25000, effective_from: 2026-09-17, effective_to: null, status: current,
