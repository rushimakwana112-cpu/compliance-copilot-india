       section: "s.126(2)(b)", url: "https://www.incometaxindia.gov.in/w/section-126-92"}
  deduction_s126_parents_senior:
    - {value: 50000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.126(8)(a)", url: "https://www.incometaxindia.gov.in/w/section-126-92"}
  deduction_s124_3:  # formerly 80CCD(1B): own NPS contribution, over and above s.123
    - {value: 50000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.124(3) (formerly 80CCD(1B))", url: "https://www.incometaxindia.gov.in/w/section-124-94"}
  deduction_home_loan_interest:  # self-occupied house (formerly 24(b))
    - {value: 200000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.22(2)(a) (formerly 24(b))", url: "https://www.incometaxindia.gov.in/w/section-22-218"}
  employer_nps_rate_new:  # employer's NPS contribution as a share of basic + DA (formerly 80CCD(2))
    - {value: 0.14, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.124(2), s.202", url: "https://www.incometaxindia.gov.in/w/section-124-94"}
  employer_nps_rate_old:
    - {value: 0.10, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.124(1)(b)", url: "https://www.incometaxindia.gov.in/w/section-124-94"}
  # HRA exemption (old regime only): least of HRA received, rent − 10% of salary, 50% / 40% of salary (basic + DA).
  hra_metro_rate:
    - {value: 0.50, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Rules, 2026",
       section: "rule 279", url: "https://www.incometaxindia.gov.in/w/rule-279-1",
