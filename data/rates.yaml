# Income tax on salary, tax year 2026-27 (Income-tax Act, 2025, in force from 1 April 2026). Used by app/tax.py.
# Slabs: `from` is exclusive (income above it), `to` inclusive, `rate` a fraction.
income_tax:
  new_regime_slabs:
    - effective_from: 2026-04-01
      effective_to: null
      status: current
      source_doc: "Income-tax Act, 2025"
      section: "s.202(1) (new regime, formerly s.115BAC)"
      url: "https://www.incometaxindia.gov.in/w/section-202-78"
      slabs:
        - {from: 0, to: 400000, rate: 0}
        - {from: 400000, to: 800000, rate: 0.05}
        - {from: 800000, to: 1200000, rate: 0.10}
        - {from: 1200000, to: 1600000, rate: 0.15}
        - {from: 1600000, to: 2000000, rate: 0.20}
        - {from: 2000000, to: 2400000, rate: 0.25}
        - {from: 2400000, to: null, rate: 0.30}
  old_regime_slabs:
    - effective_from: 2026-04-01
      effective_to: null
      status: current
      source_doc: "Income Tax Department: FAQs on Computation of Tax (old regime, below 60)"
      section: "Finance Act 2026, First Schedule"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/faqs-on-computation-of-tax"
      slabs:
        - {from: 0, to: 250000, rate: 0}
        - {from: 250000, to: 500000, rate: 0.05}
        - {from: 500000, to: 1000000, rate: 0.20}
        - {from: 1000000, to: null, rate: 0.30}
  old_regime_slabs_senior:  # resident aged 60 to 79
    - effective_from: 2026-04-01
      effective_to: null
      status: current
      source_doc: "Income Tax Department: FAQs on Computation of Tax (old regime, 60 to 79)"
      section: "Finance Act 2026, First Schedule"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/faqs-on-computation-of-tax"
      slabs:
        - {from: 0, to: 300000, rate: 0}
        - {from: 300000, to: 500000, rate: 0.05}
        - {from: 500000, to: 1000000, rate: 0.20}
        - {from: 1000000, to: null, rate: 0.30}
  old_regime_slabs_super_senior:  # resident aged 80 or more
    - effective_from: 2026-04-01
      effective_to: null
      status: current
      source_doc: "Income Tax Department: FAQs on Computation of Tax (old regime, 80 and above)"
      section: "Finance Act 2026, First Schedule"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/faqs-on-computation-of-tax"
      slabs:
        - {from: 0, to: 500000, rate: 0}
        - {from: 500000, to: 1000000, rate: 0.20}
        - {from: 1000000, to: null, rate: 0.30}
  standard_deduction_new:
    - {value: 75000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.19(1) Table Sl. 2(a)", url: "https://www.incometaxindia.gov.in/w/section-19-206"}
  standard_deduction_old:
    - {value: 50000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.19(1) Table Sl. 2(b)", url: "https://www.incometaxindia.gov.in/w/section-19-206"}
  rebate_new_income_limit:
    - {value: 1200000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.156(2) (rebate, formerly s.87A)", url: "https://www.incometaxindia.gov.in/w/section-156-84"}
  rebate_new_max:
    - {value: 60000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.156(2)(a)", url: "https://www.incometaxindia.gov.in/w/section-156-84"}
  rebate_old_income_limit:
    - {value: 500000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.156(1)", url: "https://www.incometaxindia.gov.in/w/section-156-84"}
  rebate_old_max:
    - {value: 12500, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.156(1)", url: "https://www.incometaxindia.gov.in/w/section-156-84"}
  cess_rate:
    - {value: 0.04, effective_from: 2026-04-01, effective_to: null, status: current,
       source_doc: "Income Tax Department: FAQs on Computation of Tax", section: "Health and Education Cess",
       url: "https://www.incometaxindia.gov.in/documents/d/guest/faqs-on-computation-of-tax"}
  # Surcharge on income above `from` (marginal relief applied in app/tax.py). The new regime stops at 25%.
  surcharge_old:
    - effective_from: 2026-04-01
      effective_to: null
      status: current
      source_doc: "Income Tax Department: FAQs on Computation of Tax"
      section: "Surcharge"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/faqs-on-computation-of-tax"
      slabs:
        - {from: 5000000, to: 10000000, rate: 0.10}
        - {from: 10000000, to: 20000000, rate: 0.15}
        - {from: 20000000, to: 50000000, rate: 0.25}
        - {from: 50000000, to: null, rate: 0.37}
  surcharge_new:
    - effective_from: 2026-04-01
      effective_to: null
      status: current
      source_doc: "Income Tax Department: FAQs on Computation of Tax"
      section: "Surcharge (new regime, maximum 25%)"
      url: "https://www.incometaxindia.gov.in/documents/d/guest/faqs-on-computation-of-tax"
      slabs:
        - {from: 5000000, to: 10000000, rate: 0.10}
        - {from: 10000000, to: 20000000, rate: 0.15}
        - {from: 20000000, to: null, rate: 0.25}
  # Deductions. The new regime allows none of these except the employer's NPS contribution (s.202(2)).
  deduction_s123:  # formerly 80C: PPF, ELSS, life insurance, employee PF, principal of a home loan
    - {value: 150000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.123 (formerly 80C)", url: "https://www.incometaxindia.gov.in/w/section-123-96"}
  deduction_s126_self:  # formerly 80D: health insurance for self, spouse and children
    - {value: 25000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.126(2)(a) (formerly 80D)", url: "https://www.incometaxindia.gov.in/w/section-126-92"}
  deduction_s126_self_senior:
    - {value: 50000, effective_from: 2026-04-01, effective_to: null, status: current, source_doc: "Income-tax Act, 2025",
       section: "s.126(8)(a)", url: "https://www.incometaxindia.gov.in/w/section-126-92"}
  deduction_s126_parents:
