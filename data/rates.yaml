  employer_rate:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "ESIC contribution-rate notification", section: "", url: ""}

gratuity:
  days_per_year:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "Code on Social Security, 2020 (gratuity section)", section: "", url: ""}
  wage_days_divisor:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "Code on Social Security, 2020 (gratuity section)", section: "", url: ""}
  min_years_permanent:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "Code on Social Security, 2020 (gratuity section)", section: "", url: ""}
  min_years_fixed_term:
    - {value: null, effective_from: null, effective_to: null, status: current, source_doc: "Code on Social Security, 2020 (gratuity section)", section: "", url: ""}
  # Months in the final year after which it counts as a full year (null = only completed years count).
  round_up_after_months:
