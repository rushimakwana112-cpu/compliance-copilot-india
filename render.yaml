# Render Blueprint: one free web service. Secrets are entered in the Render dashboard
# (sync: false means "ask me for the value"), never committed here.
# The app does not run ingestion on Render: Pinecone already holds the indexed documents.
services:
  - type: web
    name: compliance-copilot
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz      # liveness only: no Groq or Pinecone calls, so a slow provider can't fail it
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_PROVIDER
        value: groq
      - key: EMBED_PROVIDER
        value: pinecone
      - key: PUBLIC_MODE
        value: "true"
      - key: SCORE_THRESHOLD
        value: "0.38"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: PINECONE_INDEX
        value: compliance-copilot-cloud
      - key: GROQ_API_KEY
        sync: false            # secret: pasted in the Render dashboard
      - key: PINECONE_API_KEY
        sync: false            # secret: pasted in the Render dashboard
